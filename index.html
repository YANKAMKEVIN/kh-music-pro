<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KH Music Pro</title>
  <meta name="theme-color" content="#060914" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- Écran d'attente : le logo, visible dès la première image, retiré par l'application à son premier affichage. -->
  <style>
    html { background: #060914; }
    #boot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #060914; }
    #boot span { display: grid; place-items: center; width: 84px; height: 84px; border-radius: 24px; font: 800 32px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #050816;
      background: #16051f; box-shadow: 0 0 40px rgba(34, 211, 238, .45); animation: bootbeat 1.6s ease-in-out infinite; }
    #boot img { width: 100%; height: 100%; object-fit: contain; border-radius: inherit; }
    @keyframes bootbeat { 50% { transform: scale(1.06); box-shadow: 0 0 64px rgba(167, 139, 250, .7); } }
    @media (prefers-reduced-motion: reduce) { #boot span { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><span><img src="/icon-192.png" alt="" width="84" height="84" /></span></div>
  <header id="top"></header>
  <nav id="abar"></nav>
  <main>
    <section id="arr" aria-label="Arrangement"></section>
    <section id="bottom">
      <div id="split" role="separator" aria-orientation="horizontal"></div>
      <nav id="tabs" role="tablist">
        <button role="tab" data-tab="editor"></button>
        <button role="tab" data-tab="mixer"></button>
        <button role="tab" data-tab="live"></button>
      </nav>
      <div id="panel"></div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fAudio" accept="audio/*,.wav,.mp3,.ogg,.flac,.m4a,.aif,.aiff" hidden />
  <input type="file" id="fMidi" accept=".mid,.midi,audio/midi" hidden />
  <input type="file" id="fProj" accept=".khm,application/json" hidden />
  <dialog id="help"></dialog>
  <dialog id="lib"></dialog>
  <dialog id="notes"></dialog>
  <dialog id="expopts"></dialog>
  <dialog id="fx"></dialog>
  <dialog id="audio"></dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
