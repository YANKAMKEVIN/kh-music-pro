# Lance la campagne de QA complète (un cas d'usage = un test dans un vrai navigateur) à chaque mise à jour.
name: QA
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: bash qa/all.sh
        env:
          NODE_PATH: node_modules
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-qa
          path: qa/REPORT.md
