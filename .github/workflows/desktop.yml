# Construit la version bureau (Windows, macOS, Linux). Les installateurs sont à télécharger dans les « Artifacts » de l'exécution.
# Se lance à la main (onglet Actions > Version bureau > Run workflow), quand la partie bureau change,
# ou à la pose d'une étiquette de version (v0.8.0…) : les installateurs sont alors publiés dans une Release.
name: Version bureau
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*.*.*']
    paths: ['electron/**', '.github/workflows/desktop.yml', 'qa/desktop-smoke.cjs']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux, args: --linux AppImage }
          - { os: windows-latest, name: windows, args: --win nsis }
          - { os: macos-latest, name: macos, args: --mac dmg }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Vérifier que l'application démarre et produit du son
        if: matrix.name == 'linux'
        run: xvfb-run -a node qa/desktop-smoke.cjs
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: kh-music-pro-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publier les installateurs
        run: |
          # La Release existe déjà si l'étiquette a été créée depuis la page Releases de GitHub : on y ajoute alors les fichiers.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "KH Music Pro $TAG" --notes "$NOTES"
          gh release upload "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: "Installateurs Windows (.exe), macOS (.dmg) et Linux (.AppImage). Ils ne sont pas signés, Windows et macOS affichent donc un avertissement au premier lancement. Version en ligne sur https://yankamkevin.github.io/kh-music-pro/"
