# Construit la version bureau (Windows, macOS, Linux). Les installateurs sont à télécharger dans les « Artifacts » de l'exécution.
# Se lance à la main (onglet Actions > Version bureau > Run workflow) ou quand la partie bureau change.
name: Version bureau
on:
  workflow_dispatch:
  push:
    paths: ['electron/**', '.github/workflows/desktop.yml', 'qa/desktop-smoke.cjs']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux, args: --linux AppImage }
          - { os: windows-latest, name: windows, args: --win nsis }
          - { os: macos-latest, name: macos, args: --mac dmg }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Vérifier que l'application démarre et produit du son
        if: matrix.name == 'linux'
        run: xvfb-run -a node qa/desktop-smoke.cjs
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: kh-music-pro-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
          if-no-files-found: error
