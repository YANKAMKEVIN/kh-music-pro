# Import ponctuel des échantillons de la V15 sur la branche de travail.
name: Préparer la banque généraliste
on:
  push:
    branches: [v15-banque-generaliste]
    paths: [.github/workflows/prepare-bank.yml]
permissions:
  contents: write
  actions: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/v15-banque-generaliste'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Importer les notes depuis la source figée
        shell: python
        run: |
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          import urllib.request, re, time
          script = Path('tools/build-banks.sh').read_text()
          base = re.search(r'^GM=(.+)$', script, re.M)[1]
          banks = Path('src/audio/banks.ts').read_text().split('const NOTES')[0]
          dirs = re.findall(r"\w+: '([^']+)'", banks)
          names = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B']
          def fetch(item):
              folder, midi = item
              dest = Path('public/banks') / folder / f'{midi}.mp3'
              if dest.is_file() and dest.stat().st_size > 100:
                  return
              dest.parent.mkdir(parents=True, exist_ok=True)
              note = f'{names[midi % 12]}{midi // 12 - 1}'
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(f'{base}/{folder}-mp3/{note}.mp3', timeout=40) as response:
                          data = response.read()
                      if len(data) < 100 or not (data[:3] == b'ID3' or data[0] == 255):
                          raise ValueError(f'Fichier MP3 invalide : {folder}/{note}')
                      dest.write_bytes(data)
                      return
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(attempt + 1)
          items = [(folder, midi) for folder in dirs if folder != 'drums' for midi in range(24, 97, 3)]
          with ThreadPoolExecutor(max_workers=12) as pool:
              list(pool.map(fetch, items))
          print(f'{len(items)} notes disponibles dans {len(dirs) - 1} banques.')
      - name: Enregistrer les sons sur la branche
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/banks
          git commit -m 'Inclut les 450 notes de la banque généraliste'
          git push origin HEAD:v15-banque-generaliste
      - name: Vérifier et construire la version complète
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run qa.yml --ref v15-banque-generaliste
          gh workflow run desktop.yml --ref v15-banque-generaliste
